    <circle cx="572" cy="126" r="16" fill="#fff6df"/>
    <path d="M476 156c48-28 92 10 144-4v52H476Z" fill="#1b4a50"/>
    <path d="M476 186c60-16 110 12 144 0v22H476Z" fill="#102226"/>
    <text x="548" y="268" fill="#c9c0b2" font-size="14">ESP32-S3 图片徽章</text>
  </g>
</svg>
