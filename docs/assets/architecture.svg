<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Web Serial 直连结构</title>
  <desc id="archDesc">HTTPS 静态页面在浏览器内处理图片，并通过 Web Serial 直接连接 USB 图片徽章。</desc>
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <rect x="24" y="46" width="292" height="196" rx="18" fill="#1b1916" stroke="#3c362d"/>
    <path d="M24 64a18 18 0 0 1 18-18h256a18 18 0 0 1 18 18v20H24Z" fill="#26231d"/>
    <circle cx="52" cy="64" r="4" fill="#a79d90"/>
    <circle cx="68" cy="64" r="4" fill="#a79d90"/>
    <circle cx="84" cy="64" r="4" fill="#a79d90"/>
    <text x="170" y="132" fill="#e7c48a" font-size="18">HTTPS 静态页面</text>
    <text x="170" y="162" fill="#c9c0b2" font-size="13">浏览器裁切与 JPEG / CRC</text>
    <text x="170" y="188" fill="#c9c0b2" font-size="13">Web Serial · 115200 baud</text>
    <path d="M332 144h78" stroke="#e7c48a" stroke-width="2"/>
