name: 部署静态页面与固件镜像

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.mirror.outputs.deploy }}
    steps:
      - name: 检出项目源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mirror latest stable firmware for same-origin browser downloads
        id: mirror
        env:
          PAGES_ORIGIN: https://electronic-badge-project.github.io/electronic-badge
        run: |
          set -euo pipefail
          release_base='https://github.com/ocean-sudo/electronic-badge/releases'
          release_fetch() {
            local output="$1" expected_status="$2" url="$release_base/$3"
            shift 3
            local headers="$RUNNER_TEMP/release-response-headers" result status rc=0
            : > "$headers"
            result="$(curl -q -fsS --retry 3 --proto-redir '=https' \
              --dump-header "$headers" --output "$output" \
              --write-out '%{http_code} %{redirect_url}' "$@" "$url")" || rc=$?
            status="${result%% *}"
            if (( rc != 0 )) || [[ "$status" != "$expected_status" ]]; then
              printf 'Release request %s failed: HTTP %s (expected %s, curl %s).\n' "$url" "$status" "$expected_status" "$rc" >&2
              # Asset redirects contain signed URLs; only print rate-limit headers.
              awk 'tolower($0) ~ /^(retry-after|x-ratelimit-(limit|remaining|reset|resource|used)):/ { sub(/\r$/, ""); print }' "$headers" >&2
              return 1
            fi
            if [[ "$expected_status" == 302 ]]; then
              printf '%s\n' "${result#* }"
            fi
          }

          # Resolve latest once so a concurrent release cannot mix asset versions.
          latest_url="$(release_fetch /dev/null 302 latest --head)"
          if [[ "$latest_url" != "$release_base/tag/"* ]]; then
            echo 'Latest release redirected outside the expected release tags.' >&2
            exit 1
          fi
          tag="${latest_url#"$release_base/tag/"}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Latest release is not a stable vMAJOR.MINOR.PATCH tag.' >&2
            exit 1
          fi
          release_fetch "$RUNNER_TEMP/SHA256SUMS" 200 "download/$tag/SHA256SUMS" --location --max-filesize 1024
          manifest_line="$(cat "$RUNNER_TEMP/SHA256SUMS")"
          if [[ ! "$manifest_line" =~ ^([[:xdigit:]]{64})[[:space:]]+\*?firmware\.bin$ ]]; then
            echo 'Latest release has an invalid SHA256SUMS manifest.' >&2
            exit 1
          fi
          expected_sha="$(printf '%s' "$manifest_line" | cut -c1-64 | tr '[:upper:]' '[:lower:]')"
          if [[ "$GITHUB_EVENT_NAME" == schedule ]] && curl -fsSL "$PAGES_ORIGIN/console/firmware/current.json?ts=$(date +%s)" -o "$RUNNER_TEMP/current.json"; then
            if jq -e --arg tag "$tag" --arg sha "$expected_sha" '.tag_name == $tag and .sha256 == $sha' "$RUNNER_TEMP/current.json" >/dev/null; then
              echo 'deploy=false' >> "$GITHUB_OUTPUT"
              echo "Pages already serves $tag ($expected_sha); skipping deployment."
              exit 0
            fi
          fi
          target="docs/console/firmware/$tag"
          mkdir -p "$target"
          release_fetch "$target/firmware.bin" 200 "download/$tag/firmware.bin" --location --max-filesize 3145728
          cp "$RUNNER_TEMP/SHA256SUMS" "$target/SHA256SUMS"
          release_fetch "$target/BUILD-INFO.txt" 200 "download/$tag/BUILD-INFO.txt" --location --max-filesize 16384
          firmware_size="$(wc -c < "$target/firmware.bin")"
          if (( firmware_size < 32 )); then
            echo 'Mirrored firmware is too short to be an ESP app image.' >&2
            exit 1
          fi
          actual_sha="$(sha256sum "$target/firmware.bin" | cut -d ' ' -f 1)"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo 'Mirrored firmware does not match SHA256SUMS.' >&2
            exit 1
          fi
          jq -n --arg tag "$tag" --arg sha "$actual_sha" --argjson size "$firmware_size" '{tag_name:$tag,sha256:$sha,size:$size}' > docs/console/firmware/current.json
          echo 'deploy=true' >> "$GITHUB_OUTPUT"
      - name: Configure GitHub Pages
        if: steps.mirror.outputs.deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: 上传静态介绍页
        if: steps.mirror.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  # Finish uploading in a separate job before deploy-pages looks up the artifact.
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布介绍主页
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
